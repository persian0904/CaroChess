<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Karo Offline PRO – Wood Edition (Zoom)</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#cfa97e;
}
.app{
  text-align:center;
  padding:10px;
  font-weight:600;
}

/* ===== WOOD BOARD ===== */
.game{
  margin-top:12px;
  display:inline-block;
  padding:12px;
  background:linear-gradient(135deg,#d2a679,#b5835a);
  border-radius:14px;
  box-shadow:
    inset 0 0 10px rgba(0,0,0,.35),
    0 8px 16px rgba(0,0,0,.45);
  transform-origin: top center;
  transition: transform .15s ease;
  touch-action: none;
}
.board-row{display:flex;justify-content:center}
.square{
  width:42px;
  height:42px;
  border:1px solid rgba(0,0,0,.4);
  background:rgba(255,255,255,.15);
  cursor:pointer;
  padding:0;
  touch-action: manipulation;
}

/* ===== STONES ===== */
.stone{
  width:32px;
  height:32px;
  border-radius:50%;
  margin:auto;
  animation:drop .15s ease-out;
}
.red{
  background:radial-gradient(circle at 30% 30%,#ffd6d6,#b30000 70%);
  border:2px solid #660000;
}
.black{
  background:radial-gradient(circle at 30% 30%,#777,#000 70%);
  border:2px solid #000;
}
@keyframes drop{
  from{transform:scale(.3);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* ===== UI ===== */
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:6px;
  flex-wrap:wrap;
}
.button{
  height:32px;
  min-width:36px;
  border-radius:6px;
  border:1px solid #555;
  background:#f0e0c0;
  cursor:pointer;
}
.button:hover{background:#e6cfa3}
.status{min-width:180px;text-align:left}

#moveHistory{
  margin-top:10px;
  font-size:14px;
  max-height:200px;
  overflow:auto;
  text-align:left;
  display:inline-block;
  background:#fff8e6;
  padding:6px 10px;
  border-radius:6px;
}
.move{
  cursor:pointer;
  padding:2px 4px;
  border-radius:4px;
}
.move:hover{background:#ffe0a3}
.move.active{
  background:#ffd27a;
  font-weight:bold;
}
select{
  height:32px;
  border-radius:6px;
}
</style>
</head>

<body>
<div class="app">
<h2>🎮 Karo Wood</h2>

<div class="controls">
  <div id="status" class="status"></div>

  <label>📐 Board:
    <select id="sizeSelect">
      <option value="10">10 × 10</option>
      <option value="15">15 × 15</option>
      <option value="20">20 × 20</option>
    </select>
  </label>

  <button class="button" id="undo">↶</button>
  <button class="button" id="redo">↷</button>
  <button class="button" id="zoomOut">➖</button>
  <button class="button" id="zoomIn">➕</button>
  <button class="button" id="restart">⟳</button>
</div>

<div id="board" class="game"></div>
<div id="moveHistory"></div>
</div>

<script>
let dimension = 10;
let squares = [];
let xIsNext = true;
let winner = null;
let history = [];
let historyIndex = -1;

/* ===== ZOOM ===== */
let zoomLevel = 1;
const ZOOM_MIN = 0.6;
const ZOOM_MAX = 1.6;
const ZOOM_STEP = 0.1;
let lastTouchDistance = null;
let lastTapTime = 0;

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const historyEl = document.getElementById("moveHistory");
const sizeSelect = document.getElementById("sizeSelect");

function applyZoom(){
  boardEl.style.transform = `scale(${zoomLevel})`;
}

/* ===== INIT ===== */
function init(){
  squares = Array.from({length:dimension},()=>Array(dimension).fill(null));
  history = [];
  historyIndex = -1;
  xIsNext = true;
  winner = null;
  zoomLevel = 1;
  applyZoom();
  render();
  updateStatus();
  updateHistory();
}

sizeSelect.onchange = ()=>{
  dimension = parseInt(sizeSelect.value);
  init();
};

/* ===== RENDER ===== */
function render(){
  boardEl.innerHTML = "";
  for(let r=0;r<dimension;r++){
    const row = document.createElement("div");
    row.className = "board-row";
    for(let c=0;c<dimension;c++){
      const btn = document.createElement("button");
      btn.className = "square";
      if(squares[r][c]){
        const s = document.createElement("div");
        s.className = "stone " + (squares[r][c]==="X"?"red":"black");
        btn.appendChild(s);
      }
      btn.onclick = ()=>handleClick(r,c);
      row.appendChild(btn);
    }
    boardEl.appendChild(row);
  }
}

function updateStatus(){
  statusEl.textContent = winner
    ? "🏆 " + (winner==="X" ? "🔴 Red" : "⚫ Black") + " wins"
    : "👉 Turn: " + (xIsNext ? "🔴 Red" : "⚫ Black");
}

/* ===== GAME LOGIC ===== */
function handleClick(r,c){
  if(winner || squares[r][c]) return;
  squares[r][c] = xIsNext ? "X" : "O";
  saveHistory(r,c);
  if(checkWin(r,c)) winner = squares[r][c];
  xIsNext = !xIsNext;
  render();
  updateStatus();
}

function checkWin(r,c){
  const p = squares[r][c];
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for(const [dx,dy] of dirs){
    let cnt = 1;
    for(let i=1;i<5;i++){
      const nr=r+dx*i,nc=c+dy*i;
      if(nr<0||nc<0||nr>=dimension||nc>=dimension||squares[nr][nc]!==p) break;
      cnt++;
    }
    for(let i=1;i<5;i++){
      const nr=r-dx*i,nc=c-dy*i;
      if(nr<0||nc<0||nr>=dimension||nc>=dimension||squares[nr][nc]!==p) break;
      cnt++;
    }
    if(cnt>=5) return true;
  }
  return false;
}

/* ===== HISTORY ===== */
function toCoord(r,c){
  return String.fromCharCode(65+c)+(r+1);
}

function saveHistory(r,c){
  history = history.slice(0, historyIndex+1);
  history.push({
    squares: JSON.parse(JSON.stringify(squares)),
    move: toCoord(r,c)
  });
  historyIndex++;
  updateHistory();
}

function updateHistory(){
  historyEl.innerHTML = "<b>📜 Move History</b><br>";
  history.forEach((h,i)=>{
    const div = document.createElement("div");
    div.className = "move" + (i===historyIndex?" active":"");
    div.textContent = (i+1)+". "+(i%2===0?"🔴 Red ":"⚫ Black ")+h.move;
    div.onclick = ()=>{
      historyIndex = i;
      restore();
    };
    historyEl.appendChild(div);
  });
}

function restore(){
  const h = history[historyIndex];
  squares = JSON.parse(JSON.stringify(h.squares));
  winner = null;
  xIsNext = (historyIndex + 1) % 2 === 0;
  render();
  updateStatus();
  updateHistory();
}

/* ===== CONTROLS ===== */
document.getElementById("undo").onclick = ()=>{
  if(historyIndex>0){ historyIndex--; restore(); }
};
document.getElementById("redo").onclick = ()=>{
  if(historyIndex<history.length-1){ historyIndex++; restore(); }
};
document.getElementById("restart").onclick = init;

document.getElementById("zoomIn").onclick = ()=>{
  if(zoomLevel < ZOOM_MAX){
    zoomLevel += ZOOM_STEP;
    applyZoom();
  }
};
document.getElementById("zoomOut").onclick = ()=>{
  if(zoomLevel > ZOOM_MIN){
    zoomLevel -= ZOOM_STEP;
    applyZoom();
  }
};

/* ===== TOUCH ZOOM ===== */
function getTouchDistance(t1, t2){
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

boardEl.addEventListener("touchstart", e=>{
  if(e.touches.length === 2){
    lastTouchDistance = getTouchDistance(e.touches[0], e.touches[1]);
  }
});

boardEl.addEventListener("touchmove", e=>{
  if(e.touches.length === 2 && lastTouchDistance){
    e.preventDefault();
    const newDist = getTouchDistance(e.touches[0], e.touches[1]);
    zoomLevel += (newDist - lastTouchDistance) / 200;
    zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoomLevel));
    applyZoom();
    lastTouchDistance = newDist;
  }
},{passive:false});

boardEl.addEventListener("touchend", ()=>{
  lastTouchDistance = null;
});

/* ===== DOUBLE TAP RESET ===== */
boardEl.addEventListener("touchend", ()=>{
  const now = Date.now();
  if(now - lastTapTime < 300){
    zoomLevel = 1;
    applyZoom();
  }
  lastTapTime = now;
});

init();
</script>
</body>
</html>

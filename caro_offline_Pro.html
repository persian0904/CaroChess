<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Caro Offline FINAL – Wood Edition</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#cfa97e;
}
.app{
  text-align:center;
  padding:10px;
  font-weight:600;
}

/* ===== BOARD WOOD ===== */
.game{
  margin-top:12px;
  display:inline-block;
  padding:12px;
  background:linear-gradient(135deg,#d2a679,#b5835a);
  border-radius:14px;
  box-shadow:
    inset 0 0 10px rgba(0,0,0,.35),
    0 8px 16px rgba(0,0,0,.45);
}
.board-row{display:flex;justify-content:center}
.square{
  width:28px;
  height:28px;
  border:1px solid rgba(0,0,0,.4);
  background:rgba(255,255,255,.15);
  cursor:pointer;
  padding:0;
}

/* ===== STONES ===== */
.stone{
  width:20px;
  height:20px;
  border-radius:50%;
  margin:auto;
  animation:drop .15s ease-out;
}
.red{
  background:radial-gradient(circle at 30% 30%,#ffd6d6,#b30000 70%);
  border:2px solid #660000;
  box-shadow:
    inset -2px -2px 4px rgba(0,0,0,.4),
    0 2px 4px rgba(0,0,0,.4);
}
.black{
  background:radial-gradient(circle at 30% 30%,#777,#000 70%);
  border:2px solid #000;
  box-shadow:
    inset -2px -2px 4px rgba(255,255,255,.15),
    0 2px 4px rgba(0,0,0,.6);
}
@keyframes drop{
  from{transform:scale(.3);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* ===== UI ===== */
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:6px;
  flex-wrap:wrap;
}
.button{
  height:32px;
  min-width:36px;
  border-radius:6px;
  border:1px solid #555;
  background:#f0e0c0;
  cursor:pointer;
}
.button:hover{background:#e6cfa3}
.status{min-width:170px;text-align:left}

#moveHistory{
  margin-top:10px;
  font-size:14px;
  max-height:200px;
  overflow:auto;
  text-align:left;
  display:inline-block;
  background:#fff8e6;
  padding:6px 10px;
  border-radius:6px;
}
.move{
  cursor:pointer;
  padding:2px 4px;
  border-radius:4px;
}
.move:hover{background:#ffe0a3}
.move.active{
  background:#ffd27a;
  font-weight:bold;
}
select{
  height:32px;
  border-radius:6px;
}
</style>
</head>

<body>
<div class="app">
<h2>🎮 Cờ Caro Offline FINAL – Wood</h2>

<div class="controls">
  <div id="status" class="status"></div>

  <label>📐 Bàn:
    <select id="sizeSelect">
      <option value="10">10x10</option>
      <option value="15">15x15</option>
      <option value="20">20x20</option>
    </select>
  </label>

  <button class="button" id="restart">⟳</button>
  <button class="button" id="undo">↶</button>
  <button class="button" id="redo">↷</button>
</div>

<div id="board" class="game"></div>
<div id="moveHistory"></div>
</div>

<script>
let dimension = 10;
let squares = [];
let xIsNext = true;
let winner = null;
let history = [];
let historyIndex = -1;

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const historyEl = document.getElementById("moveHistory");
const sizeSelect = document.getElementById("sizeSelect");

/* ===== INIT ===== */
function init(){
  squares = Array.from({length:dimension},()=>Array(dimension).fill(null));
  history = [];
  historyIndex = -1;
  xIsNext = true;
  winner = null;
  render();
  updateStatus();
  updateHistory();
}

sizeSelect.onchange = ()=>{
  dimension = parseInt(sizeSelect.value);
  init();
};

/* ===== RENDER ===== */
function render(){
  boardEl.innerHTML = "";
  for(let r=0;r<dimension;r++){
    const row = document.createElement("div");
    row.className = "board-row";
    for(let c=0;c<dimension;c++){
      const btn = document.createElement("button");
      btn.className = "square";
      if(squares[r][c]){
        const s = document.createElement("div");
        s.className = "stone " + (squares[r][c]==="X"?"red":"black");
        btn.appendChild(s);
      }
      btn.onclick = ()=>handleClick(r,c);
      row.appendChild(btn);
    }
    boardEl.appendChild(row);
  }
}

function updateStatus(){
  statusEl.textContent = winner
    ? "🏆 " + (winner==="X"?"🔴 Đỏ":"⚫ Đen") + " thắng"
    : "👉 Lượt: " + (xIsNext?"🔴 Đỏ":"⚫ Đen");
}

/* ===== GAME LOGIC ===== */
function handleClick(r,c){
  if(winner || squares[r][c]) return;
  squares[r][c] = xIsNext ? "X" : "O";
  saveHistory(r,c);
  if(checkWin(r,c)) winner = squares[r][c];
  xIsNext = !xIsNext;
  render();
  updateStatus();
}

function checkWin(r,c){
  const p = squares[r][c];
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for(const [dx,dy] of dirs){
    let cnt = 1;
    for(let i=1;i<5;i++){
      const nr=r+dx*i,nc=c+dy*i;
      if(nr<0||nc<0||nr>=dimension||nc>=dimension||squares[nr][nc]!==p) break;
      cnt++;
    }
    for(let i=1;i<5;i++){
      const nr=r-dx*i,nc=c-dy*i;
      if(nr<0||nc<0||nr>=dimension||nc>=dimension||squares[nr][nc]!==p) break;
      cnt++;
    }
    if(cnt>=5) return true;
  }
  return false;
}

/* ===== HISTORY ===== */
function toCoord(r,c){
  return String.fromCharCode(65+c) + (r+1);
}

function saveHistory(r,c){
  history = history.slice(0, historyIndex+1);
  history.push({
    squares: JSON.parse(JSON.stringify(squares)),
    xIsNext,
    move: toCoord(r,c)
  });
  historyIndex++;
  updateHistory();
}

function updateHistory(){
  historyEl.innerHTML = "<b>📜 Lịch sử nước đi</b><br>";
  history.forEach((h,i)=>{
    const div = document.createElement("div");
    div.className = "move" + (i===historyIndex ? " active" : "");
    div.textContent = (i+1)+". "+(i%2===0?"🔴 ":"⚫ ")+h.move;
    div.onclick = ()=>{
      historyIndex = i;
      restore();
    };
    historyEl.appendChild(div);
  });
}

function restore(){
  const h = history[historyIndex];
  squares = JSON.parse(JSON.stringify(h.squares));
  xIsNext = h.xIsNext;
  winner = null;
  render();
  updateStatus();
  updateHistory();
}

/* ===== CONTROLS ===== */
document.getElementById("undo").onclick = ()=>{
  if(historyIndex>0){ historyIndex--; restore(); }
};
document.getElementById("redo").onclick = ()=>{
  if(historyIndex<history.length-1){ historyIndex++; restore(); }
};
document.getElementById("restart").onclick = init;

init();
</script>
</body>
</html>
